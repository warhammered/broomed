[package]
name = "broomed"
version = "0.1.0"
edition = "2021"
description = "Broomed desktop shell (Tauri) reusing broomed-core"
authors = ["Broomed"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/warhammered/broomed"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
broomed-core = { path = "../crates/broomed-core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["local-ai"]
local-ai = ["broomed-core/local-ai"]
