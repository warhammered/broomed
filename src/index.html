<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broomed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="pet-container" class="pet-container" data-tauri-drag-region>
    <!-- OpenPets-Style Speech Bubble & Action HUD -->
    <div id="mascot-bubble" class="mascot-bubble hidden" role="dialog" aria-label="Broomed companion HUD">
      <!-- Bubble Header with Status & Close -->
      <div class="bubble-header">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span id="status-label" class="status-label">Local Engine</span>
        </div>
        <button id="bubble-close" class="bubble-close" aria-label="Close bubble">&times;</button>
      </div>

      <!-- Main Interaction View -->
      <div id="bubble-main-view" class="bubble-content">
        <div id="bubble-msg" class="bubble-msg">Drop a folder to organize, or ask me anything!</div>
        
        <!-- Prompt input -->
        <div class="bubble-input-wrapper">
          <input type="text" id="bubble-input" class="bubble-input"
                 placeholder="Ask Broomed..." aria-label="Ask Broomed a question"
                 autocomplete="off" spellcheck="false">
          <button id="bubble-send-btn" class="bubble-send-btn" aria-label="Send query">↵</button>
        </div>

        <!-- Quick Action Chips -->
        <div class="bubble-chips">
          <button id="chip-clean" class="chip-btn" title="Choose a folder to clean">
            <span>📁 Clean</span>
          </button>
          <button id="chip-undo" class="chip-btn" title="Undo last organize operation">
            <span>↩️ Undo</span>
          </button>
          <button id="chip-license" class="chip-btn" title="Manage subscription & license">
            <span>🔑 Key</span>
          </button>
        </div>
      </div>

      <!-- License Activation Sub-View -->
      <div id="bubble-license-view" class="bubble-content hidden">
        <div class="license-header">
          <span class="license-title">Activate License</span>
          <button id="license-back-btn" class="license-back-btn">← Back</button>
        </div>
        <p class="license-desc">Enter your 3-part key (e.g. BRM99-XXXXX-XXXXX):</p>
        <div class="license-input-wrapper">
          <input type="text" id="license-code-input" class="bubble-input"
                 placeholder="BRM99-XXXXX-XXXXX" autocomplete="off" spellcheck="false">
          <button id="license-submit-btn" class="bubble-submit-btn">Activate</button>
        </div>
        <div id="license-status-msg" class="license-status-msg"></div>
      </div>

      <!-- Speech Bubble Pointer Tail -->
      <div class="bubble-tail"></div>
    </div>

    <!-- Right-Click Context Menu -->
    <div id="context-menu" class="context-menu hidden" role="menu">
      <button id="menu-clean" class="menu-item" role="menuitem">
        <span class="menu-icon">🧹</span> Organize Folder...
      </button>
      <button id="menu-undo" class="menu-item" role="menuitem">
        <span class="menu-icon">↩️</span> Undo Last Move
      </button>
      <div class="menu-divider"></div>
      <button id="menu-license" class="menu-item" role="menuitem">
        <span class="menu-icon">🔑</span> License & Plans...
      </button>
      <button id="menu-web" class="menu-item" role="menuitem">
        <span class="menu-icon">🌐</span> Open broomed.app
      </button>
      <div class="menu-divider"></div>
      <button id="menu-quit" class="menu-item menu-danger" role="menuitem">
        <span class="menu-icon">✖️</span> Quit
      </button>
    </div>

    <!-- The Pixel Broom Mascot Pet (Using official broomed.svg) -->
    <div id="mascot" class="mascot idle" role="button" tabindex="0"
         aria-label="Broomed mascot – click to open companion, drop folder to clean">
      <img src="broomed.svg" alt="Broomed Mascot" class="pixel-mascot" id="mascot-img" />
      
      <!-- Particle Effects Overlay -->
      <div id="particles" class="particles-container"></div>
    </div>

    <!-- Hidden folder input for file browser picker -->
    <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
