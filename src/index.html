<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broomed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <!-- Mascot -->
    <div id="mascot" class="mascot idle" aria-label="Broomed mascot">
      <svg viewBox="0 0 120 180" width="120" height="180" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
        <!-- Handle -->
        <rect x="55" y="10" width="10" height="80" rx="5" fill="#8B6914"/>
        <rect x="57" y="10" width="3" height="80" rx="1.5" fill="#A07D1A" opacity="0.5"/>

        <!-- Head (knob on top of handle) -->
        <circle cx="60" cy="12" r="12" fill="#D4A23A"/>
        <circle cx="62" cy="10" r="4" fill="#E8C36A" opacity="0.4"/>

        <!-- Eyes -->
        <g id="eyes" class="eyes">
          <ellipse cx="53" cy="12" rx="4" ry="4.5" fill="white"/>
          <ellipse cx="67" cy="12" rx="4" ry="4.5" fill="white"/>
          <circle id="pupil-l" cx="54" cy="12" r="2" fill="#1a1a2e"/>
          <circle id="pupil-r" cx="68" cy="12" r="2" fill="#1a1a2e"/>
          <circle cx="55.2" cy="10.8" r="0.8" fill="white"/>
          <circle cx="69.2" cy="10.8" r="0.8" fill="white"/>
        </g>

        <!-- Mouth -->
        <path id="mouth" d="M55 18 Q60 22 65 18" stroke="#1a1a2e" stroke-width="1.5" fill="none" stroke-linecap="round"/>

        <!-- Bristle band -->
        <rect x="40" y="85" width="40" height="8" rx="2" fill="#C49A2A"/>

        <!-- Bristles -->
        <g class="bristles">
          <path d="M42 93 L38 170 Q42 178 46 170 L44 93Z" fill="#D4A23A"/>
          <path d="M46 93 L43 175 Q47 180 51 175 L48 93Z" fill="#C49A2A"/>
          <path d="M50 93 L48 178 Q52 182 56 178 L52 93Z" fill="#D4A23A"/>
          <path d="M54 93 L53 180 Q57 183 61 180 L56 93Z" fill="#C49A2A"/>
          <path d="M58 93 L57 180 Q61 183 65 180 L60 93Z" fill="#D4A23A"/>
          <path d="M62 93 L61 178 Q65 182 69 178 L64 93Z" fill="#C49A2A"/>
          <path d="M66 93 L65 175 Q69 180 73 175 L68 93Z" fill="#D4A23A"/>
          <path d="M70 93 L68 170 Q72 178 76 170 L72 93Z" fill="#C49A2A"/>
          <path d="M74 93 L73 165 Q77 172 80 165 L76 93Z" fill="#B8891E"/>
          <path d="M38 93 L35 162 Q39 170 43 162 L40 93Z" fill="#B8891E"/>
        </g>

        <!-- Blush (subtle) -->
        <circle cx="46" cy="16" r="3" fill="#F2B8C6" opacity="0.5" class="blush"/>
        <circle cx="74" cy="16" r="3" fill="#F2B8C6" opacity="0.5" class="blush"/>
      </svg>
    </div>

    <!-- Branding -->
    <h1 class="title">Broomed</h1>
    <p class="tagline">The local-first AI file organizer.</p>

    <!-- Status -->
    <div id="status" class="status" aria-live="polite">
      <span id="status-text" class="status-text">Ready</span>
    </div>

    <!-- Drop Zone -->
    <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-label="Drop a folder here to organize, or click to browse">
      <div class="dropzone-content">
        <svg class="dropzone-icon" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12l7 7 7-7"/>
        </svg>
        <span class="dropzone-label">Drop a folder to organize</span>
        <span class="dropzone-sublabel">or click to browse</span>
      </div>
      <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
    </div>

    <!-- Results (hidden until scan) -->
    <div id="results" class="results hidden">
      <h2 class="results-title">Organizing Suggestions</h2>
      <ul id="results-list" class="results-list"></ul>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
