<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broomed Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div id="widget-root" class="widget-root">
    
    <!-- Central Mascot & Controls Column -->
    <div id="mascot-col" class="mascot-col">
      <!-- Mascot Region -->
      <div id="mascot-region" class="mascot-region">
        <img
          id="mascot-img"
          class="mascot-img"
          src="assets/mascot/coffee/broomed_coffee_1.png"
          alt="Broomed mascot"
          draggable="false"
        />
      </div>

      <!-- Bottom Controls Container -->
      <div id="widget-controls" class="widget-controls">
        
        <!-- 1. Floating Input Bar -->
        <form id="chat-form" class="chat-form" autocomplete="off">
          <button id="btn-switch-plan" class="btn-pending-pill hidden" type="button" title="View pending plan">
            <span id="pending-pill-count">1</span> plan
          </button>
          <input
            id="chat-input"
            class="chat-input"
            type="text"
            placeholder="Organize Downloads or prompt…"
            aria-label="Prompt message"
            spellcheck="false"
          />
          <button id="chat-send" class="chat-send" type="submit" aria-label="Send">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>

        <!-- 2. Mini Approval Component -->
        <div id="approval-card" class="approval-card hidden" aria-live="polite">
          <div class="approval-header">
            <div class="approval-meta">
              <span id="approval-badge" class="approval-badge">0 ops</span>
              <span id="approval-title" class="approval-title">Plan Ready</span>
            </div>
            <div class="approval-header-btns">
              <button id="btn-switch-input" class="btn-icon-switch" type="button" title="Write a new prompt">✎</button>
              <button id="btn-dismiss-approval" class="btn-dismiss" type="button" aria-label="Dismiss plan">✕</button>
            </div>
          </div>
          <p id="approval-summary" class="approval-summary">Organize files into categories?</p>
          <div class="approval-actions">
            <button id="btn-approve" class="btn-approve" type="button">✓ Organize</button>
            <button id="btn-preview-main" class="btn-preview" type="button">↗ Preview</button>
          </div>
        </div>

        <!-- 3. Mini Floating Status Toast -->
        <div id="status-toast" class="status-toast hidden">
          <span id="toast-text">Ready</span>
        </div>

      </div>
    </div>

    <!-- Custom Context Menu (Positioned to Right or Left via CSS classes) -->
    <div id="widget-context-menu" class="widget-context-menu hidden" role="menu" aria-label="Widget Options">
      <div class="menu-header">
        <span class="menu-brand">Broomed</span>
        <span class="menu-status" id="menu-ai-status">Local AI</span>
      </div>
      
      <div class="menu-divider"></div>

      <button class="menu-item" id="menu-pick-folder" role="menuitem">
        <svg class="menu-icon" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        <span>Pick Folder to Clean...</span>
      </button>

      <button class="menu-item" id="menu-open-dashboard" role="menuitem">
        <svg class="menu-icon" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        <span>Open Dashboard</span>
      </button>

      <button class="menu-item" id="menu-undo-last" role="menuitem">
        <svg class="menu-icon" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        <span>Undo Last Move</span>
      </button>

      <div class="menu-divider"></div>

      <button class="menu-item" id="menu-toggle-sleep" role="menuitem">
        <svg class="menu-icon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <span id="menu-sleep-label">Put to Sleep</span>
      </button>

      <button class="menu-item" id="menu-settings" role="menuitem">
        <svg class="menu-icon" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Settings</span>
      </button>

      <div class="menu-divider"></div>

      <button class="menu-item menu-item-danger" id="menu-hide-widget" role="menuitem">
        <svg class="menu-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span>Hide Mascot</span>
      </button>
    </div>

  </div>

  <script src="widget.js"></script>
</body>
</html>
