<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broomed Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <!-- Mascot + Drag Region -->
  <div id="mascot-region" class="mascot-region" data-tauri-drag-region>
    <img
      id="mascot-img"
      class="mascot-img"
      src="assets/mascot/idle/broomed-idle-2.svg"
      alt="Broomed mascot"
      draggable="false"
    />
  </div>

  <!-- Chat Panel (slides out) -->
  <div id="chat-panel" class="chat-panel" aria-hidden="true">
    <div class="chat-inner">
      <div id="chat-messages" class="chat-messages">
        <p class="chat-hint">Ask me to organize a folder or describe a file.</p>
      </div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input
          id="chat-input"
          class="chat-input"
          type="text"
          placeholder="Organize Downloads…"
          aria-label="Chat message"
          spellcheck="false"
        />
        <button id="chat-send" class="chat-send" type="submit" aria-label="Send">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
