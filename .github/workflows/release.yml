name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build broomed-core
        run: cargo build --release
        working-directory: crates/broomed-core
      - name: Build tauri
        run: cargo build --release
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            crates/broomed-core/target/release/broomed*
            src-tauri/target/release/broomed*
          if-no-files-found: warn
