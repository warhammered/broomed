[package]
name = "broomed-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for broomed — FS safety + index + ops"

[lib]
name = "broomed_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"

[dev-dependencies]
serde_json = "1"
