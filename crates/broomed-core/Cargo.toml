[package]
name = "broomed-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for broomed — FS safety + index + ops"

[lib]
name = "broomed_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
getrandom = "0.2"
zeroize = { version = "1", features = ["zeroize_derive"] }
chrono = "0.4"
keyring = { version = "2", optional = true }
# ponytail: optional heavy deps for bundled embedding; stubbed for MVP, enabled via `local-ai` feature
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }

[features]
default = ["local-ai"]
local-ai = ["candle-core", "candle-nn", "tokenizers"]
cloud-ai = ["dep:reqwest"]
online-ai = ["cloud-ai", "dep:keyring"]
unstable-direct-cloud = []
keyring = ["dep:keyring"]

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
